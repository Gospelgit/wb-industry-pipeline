name: wb_industry
version: "1.0.0"
config-version: 2
profile: wb_industry

model-paths: ["models"]
seed-paths: ["seeds"]

models:
  wb_industry:
    staging:
      +materialized: view
    marts:
      +materialized: table

vars:
  jump_score_threshold: 5   # how many "normal wobbles" away counts as unusual
  jump_recent_years: 3      # the warning only looks at the latest few years

seeds:
  wb_industry:
    reviewed_jumps:
      +column_types:
        year: integer  
    ecowas_membership:
      +column_types:
        first_member_year: integer
        last_member_year: integer